/* 查词典：忽略大小写，并容忍「Zhejiang Sheng / Wenzhou City」这类后缀 */
function wxLookup(map, name){
  const k = String(name == null ? '' : name).trim();
  if(!k) return '';
  if(map[k]) return map[k];
  const k2 = k.replace(/\s*(Sheng|Province|Shi|City|Municipality|Autonomous Region|Zhuang Autonomous Region|Uygur Autonomous Region|Special Administrative Region)$/i, '').trim();
  if(map[k2]) return map[k2];
  const low = k2.toLowerCase();
  for(const key in map){ if(key.toLowerCase() === low) return map[key]; }
  return '';
}
/* 组合地名：中文源直接给中文，英文源查词典；同名前缀自动去重 */
function wxPlace(loc){
  let city = String(loc.city || '').trim();
  let region = String(loc.region || '').trim();
  const cCn = wxLookup(EN_CN_CITY, city);     if(cCn) city = cCn;      /* 英文城市 → 中文 */
  const rCn = wxLookup(EN_CN_REGION, region); if(rCn) region = rCn;    /* 英文省份 → 中文 */
  region = region.replace(/\s*(Sheng|Province|Shi|City|Municipality)$/i, '')
                 .replace(/(省|市|自治区|特别行政区|自治州|地区)$/, '')
                 .replace(/^(广西|宁夏|新疆|西藏)(壮族|回族|维吾尔|蒙古族)?$/, '$1')
                 .trim();
  city = city.replace(/(市|地区|自治州)$/, '').trim();
  if(!city && !region) return '当前位置';
  if(!region || region === city) return city || region;
  if(city.indexOf(region) >= 0) return city;
  return region + ' ' + city;
}
function wxPaint(loc, cur, day){
  const box = document.getElementById('footWeather');
  if(!box) return;
  const code = WX_CODES[Number(cur.weather_code)] || ['—','fa-cloud'];
  const ico = document.getElementById('wxIcon');
  const tmp = document.getElementById('wxTemp');
  const cty = document.getElementById('wxCity');
  const hl  = document.getElementById('wxHL');
  if(ico) ico.className = 'fa ' + code[1] + ' w-ico';
  if(tmp) tmp.textContent = Math.round(cur.temperature_2m) + '°';
  if(cty) cty.textContent = wxPlace(loc) + ' · ' + code[0];
  if(hl)  hl.textContent  = (day ? Math.round(day.temperature_2m_min[0]) + '~' + Math.round(day.temperature_2m_max[0]) + '°' : '');
  box.classList.remove('fail');
  box.title = wxPlace(loc) + ' · ' + code[0] +
    ' · 体感 ' + Math.round(cur.apparent_temperature) + '°' +
    ' · 湿度 ' + cur.relative_humidity_2m + '%' +
    ' · 风速 ' + cur.wind_speed_10m + ' km/h（数据：Open-Meteo）';
}

async function loadWeather(){
  const box = document.getElementById('footWeather');
  if(!box) return;
  try{
    const loc = await wxLocate();
    if(!loc) throw new Error('定位失败');
    const u = 'https://api.open-meteo.com/v1/forecast?latitude=' + encodeURIComponent(loc.lat) +
      '&longitude=' + encodeURIComponent(loc.lon) +
      '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m' +
      '&daily=temperature_2m_min,temperature_2m_max&timezone=auto&forecast_days=1';
    const r = await fetch(u, { cache:'no-store' });
    if(!r.ok) throw new Error('天气接口 ' + r.status);
    const w = await r.json();
    if(!w || !w.current) throw new Error('无数据');
    wxPaint(loc, w.current, w.daily);
  }catch(e){
    /* 静默降级：定位/天气不可用时不打扰用户 */
    const box2 = document.getElementById('footWeather');
    if(box2){
      box2.classList.add('fail');
      const ico = document.getElementById('wxIcon'); if(ico) ico.className = 'fa fa-cloud w-ico';
      const tmp = document.getElementById('wxTemp'); if(tmp) tmp.textContent = '--°';
      const cty = document.getElementById('wxCity'); if(cty) cty.textContent = '天气不可用';
      const hl  = document.getElementById('wxHL');  if(hl) hl.textContent = '';
      box2.title = '天气获取失败（需要联网）：' + (e && e.message ? e.message : '');
    }
  }
}
loadWeather();
setInterval(loadWeather, 15 * 60 * 1000);   /* 每 15 分钟刷新 */

  const sel = document.getElementById('footTz');

    }).join('');
    if(!TZ_LIST.some(function(t){ return t.id === worldTz; })) worldTz = 'local';
    sel.value = worldTz;
  }
  const year = document.getElementById('footYear');
  if(year) year.textContent = new Date().getFullYear();
  setWorldTimeZone(worldTz);
  setInterval(paintWorldClock, 1000);
  /* 页面从后台切回来时立刻校正一次，避免显示停滞 */
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) paintWorldClock(); });

})();
