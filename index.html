/* ===== 虚化背景层：每 15 秒随机换一张，交叉淡入淡出 ===== */
#bgStack{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#070a10;}
#bgStack .bgl{
  position:absolute;inset:-6%;
  background-position:center;background-size:cover;background-repeat:no-repeat;
  opacity:0;transition:opacity 1.6s ease-in-out;
  filter:blur(6px) saturate(1.05) brightness(.62);
  transform:scale(1.06);
}
#bgStack .bgl.on{opacity:1;}
#bgStack .veil{
  position:absolute;inset:0;
  background:
    radial-gradient(120% 90% at 20% 0%, rgba(7,10,16,.30), rgba(7,10,16,.72) 60%, rgba(7,10,16,.90) 100%),
    linear-gradient(180deg, rgba(7,10,16,.55), rgba(7,10,16,.35) 40%, rgba(7,10,16,.80));
}
#bgStack .grain{
  position:absolute;inset:0;opacity:.16;mix-blend-mode:overlay;
  background-image:radial-gradient(rgba(255,255,255,.5) .5px, transparent .5px);
  background-size:3px 3px;
}
/* 亮色主题：背景图依然显示，只是换成浅色遮罩 + 更轻的虚化 */
body > *:not(#bgStack):not(#bgParticles):not(#editModal):not(#projMenuPanel):not(#imgPreview){position:relative;z-index:1;}
#bgParticles{z-index:2;}
/* 修复：弹窗/下拉菜单/大图预览必须保持 fixed 定位，否则会被上面的规则覆盖到页面底部 */
#editModal{position:fixed !important;top:0;left:0;right:0;bottom:0;z-index:60;}
#projMenuPanel{position:fixed !important;z-index:70;}
#imgPreview{position:fixed !important;z-index:80;}

/* ===== 歌词条（有歌词显示歌词，无歌词显示歌名） ===== */
/* 歌词条：整体是一块居中玻璃条，底部有一条随播放进度走的细光带 */
.lyric-bar{
  position:relative;overflow:hidden;
  margin-top:16px;display:flex;align-items:center;gap:14px;
  padding:16px 22px;border-radius:14px;min-height:62px;
}
/* 底部进度光带 */
.lyric-bar::after{
  content:'';position:absolute;left:0;bottom:0;height:2px;width:var(--lb-progress,0%);
  background:linear-gradient(90deg,rgba(99,102,241,.9),rgba(168,85,247,.9));
  transition:width .3s linear;
}
.lb-ico{color:#8b9bb4;font-size:15px;opacity:.85;flex:0 0 auto;animation:lbFloat 4s ease-in-out infinite;}
.lb-ico.right{animation-delay:1.2s;}
.lb-ico.left{animation-delay:.4s;}
@keyframes lbFloat{0%,100%{transform:translateY(0);opacity:.5;}50%{transform:translateY(-4px);opacity:.95;}}
.lb-text{
  flex:1;min-width:0;text-align:center;font-size:16.5px;font-weight:700;letter-spacing:.6px;
  color:#e6edf8;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 0 14px rgba(167,139,250,.55), 0 0 4px rgba(167,139,250,.4);
  transition:opacity .3s ease, transform .3s ease;
}
/* 换行时的淡入淡出（由 JS 短暂加上再移除） */
.lb-text.swap{opacity:0;transform:translateY(6px);}
/* 播放中：行尾跳动光标 */
.lyric-bar.singing .lb-text::after{
  content:'';display:inline-block;width:3px;height:1.05em;margin-left:5px;background:#a78bfa;
  vertical-align:-2px;border-radius:1px;box-shadow:0 0 8px rgba(167,139,250,.9);
  animation:lbCaret 1s steps(1) infinite;
}
@keyframes lbCaret{0%,50%{opacity:1;}51%,100%{opacity:0;}}
/* 无歌词 → 标题模式：字号更大、光晕更柔和 */
.lyric-bar.title-mode .lb-text{font-size:18px;font-weight:800;color:#f2f6ff;letter-spacing:1px;text-shadow:0 0 16px rgba(148,163,184,.5);}
.lyric-bar.title-mode .lb-ico{opacity:.45;}
/* 暂停：整条压暗 */
.lyric-bar.paused .lb-text{opacity:.5;}
.lyric-bar.paused .lb-ico{animation-play-state:paused;opacity:.35;}

/* ===== 顶栏「项目」下拉菜单 ===== */
/* ===== 图片查看弹窗 =====
   注意：深色主题层里有一条 `body > * { position:relative;z-index:1 }`，
   而弹窗正是 body 的直接子元素 —— 若不提高优先级，它会被拉回文档流、
   跑到页面最底部（这正是之前的 bug）。所以用 body > #imgPreview + !important。 */
body > #imgPreview{
  position:fixed !important;top:0 !important;left:0 !important;right:0 !important;bottom:0 !important;
  z-index:99998 !important;
  display:none;                        /* 默认隐藏 */
  align-items:center;justify-content:center;
  padding:24px;

<!-- ================= 图片查看弹窗（独立 CSS，不依赖任何工具类） ================= -->
<div id="imgPreview" onclick="closeImgPreview()">
  <div class="lb-panel" onclick="event.stopPropagation()">
    <div class="lb-bar">

<script>
/* ========== 调试日志开关（写在这里，后面的脚本块也能用）==========
   默认静默：控制台不再出现音乐/背景的提示信息。
   要排查时：用 index.html?debug=1 打开，或先在控制台执行 window.SAKURA_DEBUG = true。 */
function sakuraDebugOn(){
  return !!window.SAKURA_DEBUG || /[?&]debug=1\b/.test(location.search);
}
function sakuraLog(){ if(sakuraDebugOn()) console.log.apply(console, arguments); }
function sakuraWarn(){ if(sakuraDebugOn()) console.warn.apply(console, arguments); }

/* ========== 背景音乐：随机播放 + 顶部播放器控件 ==========
   两种来源，全本地、不需要服务器：
     ① 清单：文件名写在 BGM_PLAYLIST 里（放 Music 文件夹）
     ② 文件夹：点播放器里的「选择 Music 文件夹」授权一次，
        浏览器会把授权记在 IndexedDB 里；以后每次刷新页面自动重新扫描，
        文件夹里新增/删除的歌曲会自动同步（Edge / Chrome 支持）。
   页面加载时不读取音频内容，Music 里的文件可随时改名。 */
const BGM_PLAYLIST = [
  '充满活力的午后城下町.mp3',
  '窗边的小鸟-Songbirds by the Window.mp3',
  '火焰的魔法.mp3'
];
const BGM_AUDIO_EXT = ['mp3','m4a','wav','ogg','oga','flac','aac','opus','webm'];
const BGM_DIR_NAME = 'Music';
/* 统一曲目模型：{ name, display, blob } —— blob 仅有文件夹来源时存在 */
let BGM_TRACKS = [];
const BGM_VOLUME = 0.5;
/* 这里可以给每首歌写死显示信息（优先级最高，会盖过从文件名推断的结果）：
   字段：title 曲名 / artist 艺术家 / lyric 歌词（可带 [mm:ss] 时间轴）/ cover 封面图路径
   想加新歌就照下面格式再加一条即可。 */
const BGM_META = {
  '充满活力的午后城下町.mp3':        { artist:'流光漫染轻音乐' },
  '窗边的小鸟-Songbirds by the Window.mp3': { artist:'流光漫染轻音乐' },
  '火焰的魔法.mp3':                  { artist:'流光漫染轻音乐' }
};
const BGM_DEFAULT_ARTIST = '流光漫染轻音乐';   /* 没单独指定的歌也用这个艺术家 */

let bgm = null;
let bgmStarted = false;
let bgmPick = '';
let bgmIdx = 0;

function bgmSetTracks(list){
  BGM_TRACKS = (list || []).slice();
  /* 用上一次播过的歌作为“避免重复”的依据 */
  let last = '';
  try{ last = localStorage.getItem('_bgmLast') || ''; }catch(e){}
  const idxOfLast = BGM_TRACKS.findIndex(function(t){ return t.name === last; });
  bgmIdx = BGM_TRACKS.length
    ? (idxOfLast >= 0 ? idxOfLast : Math.floor(Math.random() * BGM_TRACKS.length))
    : 0;
  if(BGM_TRACKS.length){
    if(BGM_TRACKS.length > 1 && BGM_TRACKS[bgmIdx].name === last){
      bgmIdx = (bgmIdx + 1 + Math.floor(Math.random() * (BGM_TRACKS.length - 1))) % BGM_TRACKS.length;
    }
    bgmPick = BGM_TRACKS[bgmIdx].name;
    if(bgmPick !== last){ try{ localStorage.setItem('_bgmLast', bgmPick); }catch(e){} }
  }else{
    bgmPick = '';
  }
  bgmPaint();
}
function bgmTrackByName(name){
  for(let i = 0; i < BGM_TRACKS.length; i++) if(BGM_TRACKS[i].name === name) return BGM_TRACKS[i];
  return null;
}
/* 初始曲库在下面所有变量声明完成后建立（避免 TDZ 报错） */

function bgmFmt(s){
  if(!isFinite(s) || s < 0) return '--:--';
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
}
function bgmMeta(file){
  if(!file) return { title:'', artist:'', lyric:'' };
  /* 去掉扩展名后的名字：meta 里没写 title 时用它，避免曲名后面拖着 .mp3 */
  const base = file.replace(/\.(mp3|m4a|wav|ogg|oga|flac|aac|opus|webm)$/i,'');
  if(BGM_META[file]){
    const m = BGM_META[file];
    const artist = m.artist || BGM_DEFAULT_ARTIST;
    return { title:m.title || base, artist:artist, lyric:m.lyric || ('作词：' + artist) };
  }
  let title = base, artist = BGM_DEFAULT_ARTIST;
  const sep = base.indexOf(' - ');
  if(sep > 0){
    const left = base.slice(0, sep).trim();
    const right = base.slice(sep + 3).trim();
    const hasCN = s => /[\u4e00-\u9fa5]/.test(s);
    if(hasCN(left) && !hasCN(right)){ title = left; artist = right; }
    else if(!hasCN(left) && hasCN(right)){ title = right; artist = left; }
    else { title = left; artist = right || BGM_DEFAULT_ARTIST; }
  }
  return { title:title, artist:artist, lyric:'作词：' + artist };
}
function bgmPaint(){
  /* 播放器 UI 已移除：只维护歌词条与底部进度光带 */
  const playing = !!(bgm && bgmStarted && !bgm.paused);
  const bar = document.getElementById('lyricBar');
  const pct = (bgm && isFinite(bgm.duration) && bgm.duration > 0)
    ? (bgm.currentTime / bgm.duration * 100) : 0;
  if(bar){
    bar.style.setProperty('--lb-progress', pct.toFixed(2) + '%');
    bar.classList.toggle('paused', !playing);
  }
  const icon = document.getElementById('bgmToggleIcon');
  if(icon) icon.className = playing ? 'fa fa-pause' : 'fa fa-play';
  bgmLyricTick();
}
/* ---------- 歌词 ----------
   优先读同名 .lrc（Music/歌名.lrc），支持标准 [mm:ss.xx] 时间轴；
   其次看 BGM_META 里手写的 lyric；都没有 → 歌词条单独显示歌名。 */
let bgmLyric = { file:'', lines:null, timed:false, idx:-9, plainAt:0 };
const LRC_RE = /\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;

function bgmParseLRC(text){
  const raw = String(text || '').split(/\r?\n/);
  const timed = [];
  for(const line of raw){
    const stamps = [];
    let m;
    LRC_RE.lastIndex = 0;
    while((m = LRC_RE.exec(line)) !== null){
      const min = parseInt(m[1], 10) || 0;
      const sec = parseInt(m[2], 10) || 0;
      const frac = m[3] ? parseInt((m[3] + '00').slice(0, 3), 10) / 1000 : 0;
      stamps.push(min * 60 + sec + frac);
    }
    const txt = line.replace(LRC_RE, '').trim();
    if(!txt || !stamps.length) continue;
    stamps.forEach(function(t){ timed.push({ t:t, text:txt }); });
  }
  if(timed.length){
    timed.sort(function(a, b){ return a.t - b.t; });
    return { lines:timed, timed:true };
  }
  const plain = raw.map(function(s){ return s.replace(LRC_RE, '').trim(); }).filter(Boolean);
  return { lines:plain.map(function(s){ return { t:0, text:s }; }), timed:false };
}
async function bgmLoadLyrics(file){
  bgmLyric = { file:file, lines:null, timed:false, idx:-9, plainAt:0 };
  if(!file){ bgmLyricTick(); return; }
  const meta = BGM_META[file];
  if(meta && meta.lyric){
    const txt = String(meta.lyric);
    LRC_RE.lastIndex = 0;
    if(LRC_RE.test(txt)){
      const r = bgmParseLRC(txt);
      bgmLyric.lines = r.lines; bgmLyric.timed = r.timed;
    }else{
      const arr = txt.split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean);
      bgmLyric.lines = arr.map(function(s){ return { t:0, text:s }; });
      bgmLyric.timed = false;
    }
    bgmLyricTick();
    return;
  }
  if(location.protocol === 'file:'){ bgmLyricTick(); return; }   /* 双击打开时浏览器禁止读本地 .lrc */
  try{
    const lrc = 'Music/' + encodeURIComponent(file.replace(/\.[^.]+$/, '') + '.lrc');
    const r = await fetch(lrc, { cache:'no-store' });
    if(r.ok){
      const txt = await r.text();
      if(bgmLyric.file !== file) return;                          /* 期间换歌了就丢弃 */
      const parsed = bgmParseLRC(txt);
      if(parsed.lines.length){ bgmLyric.lines = parsed.lines; bgmLyric.timed = parsed.timed; }
    }
  }catch(e){ /* 没有 .lrc → 退回显示歌名 */ }
  bgmLyricTick();
}
function bgmSetLyricText(txt){
  const el = document.getElementById('lyricText');
  if(!el || el.textContent === txt) return;
  /* 换行时先淡出再写入，避免文字"跳"一下 */
  el.classList.add('swap');
  setTimeout(function(){
    el.textContent = txt;
    el.classList.remove('swap');
  }, 150);
}
function bgmLyricTick(){
  const bar = document.getElementById('lyricBar');
  if(!bar) return;
  const info = bgmMeta(bgmPick);
  const t = (bgm && !isNaN(bgm.currentTime)) ? bgm.currentTime : 0;

  /* 没有歌词 → 单独显示歌曲名字 */
  if(!bgmLyric.lines || !bgmLyric.lines.length){
    bar.classList.add('title-mode');
    bar.classList.remove('singing');
    bar.classList.toggle('paused', !(bgm && bgmStarted && !bgm.paused));
    bgmSetLyricText(bgmPick ? info.title : '还没有音乐，把歌放进 Music 文件夹吧');
    return;
  }
  bar.classList.remove('title-mode');

  let idx;
  if(bgmLyric.timed){
    idx = 0;
    for(let i = 0; i < bgmLyric.lines.length; i++){
      if(bgmLyric.lines[i].t <= t + 0.15) idx = i; else break;
    }
  }else{
    /* 无时间轴：每 5 秒推一行 */
    if(bgmLyric.idx < 0 || t - bgmLyric.plainAt > 5 || t < bgmLyric.plainAt - 1){
      bgmLyric.plainAt = t;
      bgmLyric.idx = (bgmLyric.idx + 1) % bgmLyric.lines.length;
    }
    idx = bgmLyric.idx;
  }
  if(idx !== bgmLyric.idx){
    bgmLyric.idx = idx;
    bgmSetLyricText(bgmLyric.lines[idx].text);
  }
  const playing = !!(bgm && bgmStarted && !bgm.paused);
  bar.classList.toggle('singing', playing);
  bar.classList.toggle('paused', !playing);
}

/* ================= 自动发现 Music 里的歌曲（全本地，不用服务器）=================
   方式一（推荐，Edge/Chrome）：点播放器里的「选择 Music 文件夹」授权一次，
     授权记在 IndexedDB 里；以后每次刷新页面都会自动重新扫描该文件夹，
     新增/删除的歌曲自动同步。文件通过 blob 播放，无需服务器。
   方式二（通用兜底）：按 1.mp3、2.mp3、3.mp3… 顺序探测 Music 文件夹里存在的文件，
     允许中间缺号（最多连续 30 个空号就停止），并保留清单里的自定义文件名。 */
const BGM_IDB_NAME = 'sakura_bgm';
const BGM_IDB_STORE = 'handles';

function bgmIdb(){
  return new Promise(function(resolve){
    try{
      if(!window.indexedDB) return resolve(null);
      const req = indexedDB.open(BGM_IDB_NAME, 1);
      req.onupgradeneeded = function(){ try{ req.result.createObjectStore(BGM_IDB_STORE); }catch(e){} };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ resolve(null); };
    }catch(e){ resolve(null); }
  });
}
async function bgmIdbSet(key, val){
  const db = await bgmIdb(); if(!db) return false;
  return new Promise(function(resolve){
    try{
      const tx = db.transaction(BGM_IDB_STORE, 'readwrite');
      tx.objectStore(BGM_IDB_STORE).put(val, key);
      tx.oncomplete = function(){ resolve(true); };
      tx.onerror = function(){ resolve(false); };
    }catch(e){ resolve(false); }
  });
}
async function bgmIdbGet(key){
  const db = await bgmIdb(); if(!db) return null;
  return new Promise(function(resolve){
    try{
      const tx = db.transaction(BGM_IDB_STORE, 'readonly');
      const rq = tx.objectStore(BGM_IDB_STORE).get(key);
      rq.onsuccess = function(){ resolve(rq.result || null); };
      rq.onerror = function(){ resolve(null); };
    }catch(e){ resolve(null); }
  });
}

function bgmAudioName(name){
  const m = /.([A-Za-z0-9]+)$/.exec(name || '');
  return !!m && BGM_AUDIO_EXT.indexOf(m[1].toLowerCase()) >= 0;
}
/* 读取文件夹里的全部音频文件（含子目录里的同名列表，这里只取本层） */
async function bgmListFromDir(handle){
  const out = [];
  for await (const entry of handle.values()){
    if(entry.kind !== 'file') continue;
    if(!bgmAudioName(entry.name)) continue;
    try{
      const file = await entry.getFile();
      out.push({ name: entry.name, display: entry.name, blob: file });
    }catch(e){}
  }
  out.sort(function(x, y){ return x.name.localeCompare(y.name, 'zh'); });
  return out;
}
async function bgmEnsurePermission(handle){
  try{
    const q = await handle.queryPermission({ mode:'read' });
    if(q === 'granted') return true;
    const r = await handle.requestPermission({ mode:'read' });
    return r === 'granted';
  }catch(e){ return false; }
}
/* 刷新页面时：若之前授权过文件夹，自动重新扫描 */
async function bgmRestoreFolder(){
  try{
    const handle = await bgmIdbGet('musicDir');
    if(!handle || !handle.values) return false;
    if(!(await bgmEnsurePermission(handle))) return false;
    const list = await bgmListFromDir(handle);
    if(!list.length) return false;
    bgmSetTracks(list);
    return true;
  }catch(e){ return false; }
}
/* 让用户选一次 Music 文件夹并记住授权 */
async function bgmPickFolder(){
  try{
    if(!window.showDirectoryPicker){ alert('这个浏览器不支持选择文件夹，请把歌曲命名成 1.mp3、2.mp3… 放在 Music 文件夹里，刷新后会自动发现。'); return; }
    const handle = await window.showDirectoryPicker({ id:'sakura-music', mode:'read' });
    const list = await bgmListFromDir(handle);
    if(!list.length){ alert('这个文件夹里没找到音频文件（支持 ' + BGM_AUDIO_EXT.join(' / ') + '）'); return; }
    await bgmIdbSet('musicDir', handle);
    bgmSetTracks(list);
    sakuraLog('[音乐] 已连接文件夹，共 ' + list.length + ' 首：' + list.map(function(t){ return t.name; }).join('、'));
  }catch(e){
    if(e && e.name === 'AbortError') return;      /* 用户取消 */
    sakuraWarn('[音乐] 选择文件夹失败：' + (e && e.message));
    alert('选择文件夹失败：' + (e && e.message ? e.message : e) + '\n（可以改用 1.mp3、2.mp3… 的命名方式）');
  }
}
/* 探测 Music/数字.mp3 这类文件是否存在 */
function bgmProbeFile(url){
  return new Promise(function(resolve){
    const a = new Audio();
    let done = false;
    const fin = function(ok){
      if(done) return; done = true;
      try{ a.removeAttribute('src'); a.load(); }catch(e){}
      resolve(ok);
    };
    a.onloadedmetadata = function(){ if(!isFinite(a.duration) && a.duration !== 0){ /* 仍算存在 */ } fin(true); };
    a.onerror = function(){ fin(false); };
    setTimeout(function(){ fin(false); }, 4000);
    a.preload = 'metadata';
    a.src = url;
  });
}
/* 清单探测：从 1 开始，允许缺号，连续 30 个空号停止 */
async function bgmScanManifest(){
  const found = [];
  let miss = 0;
  /* 上次扫描到的最大编号：从它附近开始，避免每次刷新都从头探测 300 个文件名 */
  let start = 1;
  try{
    const memo = parseInt(localStorage.getItem('_bgmScanMax') || '0', 10);
    if(memo > 0) start = Math.max(1, memo - 1);
  }catch(e){}
  for(let i = start; i <= 300 && miss < 30; i++){
    let ok = false;
    for(const ext of BGM_AUDIO_EXT){
      const name = i + '.' + ext;
      ok = await bgmProbeFile(BGM_DIR_NAME + '/' + name);
      if(ok){ found.push(name); break; }
    }
    if(ok) miss = 0; else miss++;
  }
  /* 记账：下次从最大编号附近继续 */
  try{
    let maxN = 0;
    found.forEach(function(nm){ const k = parseInt(nm, 10); if(k > maxN) maxN = k; });
    const old = parseInt(localStorage.getItem('_bgmScanMax') || '0', 10);
    localStorage.setItem('_bgmScanMax', String(Math.max(old, maxN)));
  }catch(e){}
  /* 保留清单里写的自定义文件名（它们可能不叫 1.mp3） */
  const extra = BGM_PLAYLIST.filter(function(n){ return found.indexOf(n) < 0; });
  const names = found.concat(extra);
  if(!names.length) return;
  const list = names.map(function(n){ return { name:n, display:n }; });
  bgmSetTracks(list);
  sakuraLog('[音乐] 自动发现 ' + list.length + ' 首：' + names.join('、'));
}
/* 入口：刷新后自动同步一次 */
/* 只在「可能真的有数字命名歌曲」时才做探测：
   清单里已出现 1.mp3 这类名字，或以前扫到过数字编号。避免每次刷新都空跑一遍。 */
function bgmLooksNumeric(){
  let memo = 0;
  try{ memo = parseInt(localStorage.getItem('_bgmScanMax') || '0', 10) || 0; }catch(e){}
  if(memo > 0) return true;
  return BGM_PLAYLIST.some(function(nm){ return /^\d+\./.test(nm); });
}
async function bgmAutoSync(){
  try{
    const ok = await bgmRestoreFolder();
    if(ok) return;                  /* 已连接文件夹：自动跟随增删，不用探测 */
  }catch(e){}
  if(!bgmLooksNumeric()) return;   /* 清单来源：不做数字命名探测 */
  try{ await bgmScanManifest(); }catch(e){}
}


/* 彻底停掉当前音频：暂停 + 清空 src + 释放 blob。
   关键：换歌时必须先调用它，否则旧的 Audio 对象还在后台播（叠在一起）。 */
function bgmStopCurrent(){
  if(!bgm) return;
  const old = bgm;
  bgm = null;                       /* 先断开引用，避免事件回调再操作它 */
  try{ old.pause(); }catch(e){}
  try{ old.removeAttribute('src'); }catch(e){}
  try{ old.load(); }catch(e){}      /* 让浏览器真正释放解码器 */
  if(old.__blobUrl){ try{ URL.revokeObjectURL(old.__blobUrl); }catch(e){} }
}
function bgmCreate(){
  if(bgm && bgm.dataset && bgm.dataset.file === bgmPick) return bgm;
  const track = bgmTrackByName(bgmPick) || (BGM_TRACKS[bgmIdx] || null);
  if(track) bgmPick = track.name;
  if(!bgmPick) return null;
  bgmStopCurrent();                 /* ← 换歌前先彻底停掉上一首 */
  let url;
  if(track && track.blob){
    url = URL.createObjectURL(track.blob);
  }else{
    url = BGM_DIR_NAME + '/' + encodeURIComponent(bgmPick);
  }
  bgm = new Audio();
  if(track && track.blob) bgm.__blobUrl = url;
  bgm.dataset.file = bgmPick;
  bgm.loop = BGM_TRACKS.length === 1;   /* 只有一首才单曲循环 */
  bgm.volume = BGM_VOLUME;
  bgm.preload = 'none';
  bgm.src = url;
  bgm.addEventListener('timeupdate', bgmPaint);
  bgm.addEventListener('loadedmetadata', bgmPaint);
  bgm.addEventListener('play', bgmPaint);
  bgm.addEventListener('pause', bgmPaint);
  bgm.addEventListener('ended', ()=>{ bgmNext(); });
  const thisAudio = bgm;
  bgm.addEventListener('error', ()=>{
    if(bgm !== thisAudio) return;            /* 已经换歌了，忽略旧对象报的错 */
    if(BGM_TRACKS.length > 1){ bgmNext(); }
    else{ alert('背景音乐加载失败：找不到 ' + BGM_DIR_NAME + '/' + bgmPick + '\n（请检查文件名是否与文件夹里一致）'); }
  });
  try{ localStorage.setItem('_bgmLast', bgmPick); }catch(e){}
  bgmLoadLyrics(bgmPick);   /* 自动找同名 .lrc；没有就显示歌名 */
  bgmPaint();
  return bgm;
}
function bgmPlay(){
  const au = bgmCreate();
  if(!au) return;
  bgmStarted = true;
  const p = au.play();
  if(p && p.catch) p.catch(()=>{ bgmStarted = false; bgmPaint(); });
  bgmPaint();
}
function bgmToggle(){
  if(bgm && !bgm.paused && bgmStarted){
    try{ bgm.pause(); }catch(e){}
    bgmStarted = false;
    bgmPaint();
    return;
  }
  bgmPlay();
}
function bgmNext(){
  if(BGM_TRACKS.length < 1) return;
  bgmStopCurrent();                       /* ← 关键：先停掉正在播的那首 */
  bgmIdx = (bgmIdx + 1) % BGM_TRACKS.length;
  bgmPick = BGM_TRACKS[bgmIdx].name;
  bgmStarted = false;
  try{ localStorage.setItem('_bgmLast', bgmPick); }catch(e){}
  bgmPlay();
}
function bgmPrev(){
  if(BGM_TRACKS.length < 1) return;
  bgmStopCurrent();                       /* ← 关键：先停掉正在播的那首 */
  bgmIdx = (bgmIdx - 1 + BGM_TRACKS.length) % BGM_TRACKS.length;
  bgmPick = BGM_TRACKS[bgmIdx].name;
  bgmStarted = false;
  try{ localStorage.setItem('_bgmLast', bgmPick); }catch(e){}
  bgmPlay();
}

function showImgPreview(src, name){
    const img = document.getElementById('imgPreviewSrc');
    const box = document.getElementById('imgPreview');
    if(!img || !box) return;
    img.classList.remove('zoomed');

function closeImgPreview(){
    const box = document.getElementById('imgPreview');

    const img = document.getElementById('imgPreviewSrc');
    if(img){

        setTimeout(function(){

// 初始化数据结构
const STORAGE_KEY = "novel_outline_data";
function normalizeData(d){
    // 迁移：原"能力"二级图鉴数据并入"技能"
    if(Array.isArray(d.ability) && d.ability.length){
        d.skill = (Array.isArray(d.skill) ? d.skill : []).concat(d.ability);
        delete d.ability;
    }
    return {
        hero: Array.isArray(d.hero) ? d.hero : [],
        support: Array.isArray(d.support) ? d.support : [],
        weapon: Array.isArray(d.weapon) ? d.weapon : [],
        race: Array.isArray(d.race) ? d.race : [],
        raceTitle: Array.isArray(d.raceTitle) ? d.raceTitle : [], // 种族称号（种族图鉴三级标签）
        element: Array.isArray(d.element) ? d.element : [], // 职业图鉴
        skill: Array.isArray(d.skill) ? d.skill : [],       // 技能图鉴（含主动/被动/生活三类）
        lifeskill: Array.isArray(d.lifeskill) ? d.lifeskill : [], // 旧字段：已并入 skill，kind='life'，迁移后不再使用
        traitlib: Array.isArray(d.traitlib) ? d.traitlib : [], // 状态图鉴（数据字段名保持不变）
        monster: Array.isArray(d.monster) ? d.monster : [], // 怪物图鉴
        mineral: Array.isArray(d.mineral) ? d.mineral : [], // 矿物图鉴
        flora: Array.isArray(d.flora) ? d.flora : [],   // 植被图鉴
        asset: Array.isArray(d.asset) ? d.asset : []    // 素材库（原"其他设定"已移除）
        // 已移除：outline（故事提纲）、relations（人物关系图）
    };
}
let data = normalizeData(JSON.parse(localStorage.getItem(STORAGE_KEY)) || {});

// 保存到本地存储
function saveStorage(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// 一次性清理：状态图鉴（BUFF大全 / 职业BUFF / 套装BUFF）已移除等级功能，
// 把旧数据里遗留的 grade 字段删掉，避免卡片上继续出现等级徽章。
(function(){
    try{
        if(localStorage.getItem('_traitlibGradePurged_v1')) return;
        if(!Array.isArray(data.traitlib)) data.traitlib = [];
        let changed = false;
        data.traitlib.forEach(function(x){ if(x && 'grade' in x){ delete x.grade; changed = true; } });
        localStorage.setItem('_traitlibGradePurged_v1','1');
        if(changed) saveStorage();
    }catch(e){}
})();

// 一次性清理：早期版本把状态图鉴 BUFF 混进了种族称号，这里删掉同名条目（自定义称号不受影响）
(function(){
    try{
        if(localStorage.getItem('_raceTitleBuffPurged_v1')) return;
        const buffNames = new Set(
            (data.traitlib||[])
                .filter(x=>x && traitGenreNorm(x.genre)==='BUFF')
                .map(x=>(x.title||'').trim())
                .filter(Boolean)
        );
        if(!Array.isArray(data.raceTitle)) data.raceTitle = [];
        const before = data.raceTitle.length;
        data.raceTitle = data.raceTitle.filter(x=>{
            const t = (x && x.title || '').trim();
            return !(t && buffNames.has(t));      // 与 BUFF 同名的 → 判定为同步来的，移除
        });
        localStorage.setItem('_raceTitleBuffPurged_v1','1');
        if(data.raceTitle.length !== before){ saveStorage(); }
    }catch(e){ /* 清理失败不影响主流程 */ }
})();

// 技能图鉴 / 状态图鉴卡片：正文默认完整显示，超长时可手动收起 / 展开
function initCardClamp(card){
    const slot = card.querySelector('.card-slot');
    if(!slot) return;
    const body = slot.querySelector('.card-expand');
    const btn = slot.querySelector('.card-content-toggle');
    if(!body || !btn) return;

    // 只有内容确实超过 12 行时才提供「收起」按钮
    const refreshToggle = function(){
        const wasCollapsed = slot.classList.contains('is-collapsed');
        slot.classList.remove('is-collapsed');
        const full = body.offsetHeight;
        slot.classList.add('is-collapsed');
        const clamped = body.offsetHeight;
        slot.classList.toggle('is-collapsed', wasCollapsed);
        slot.classList.toggle('has-toggle', full - clamped > 8);
    };

    btn.addEventListener('click', function(){
        const collapsed = slot.classList.toggle('is-collapsed');
        btn.innerHTML = collapsed
            ? '<i class="fa fa-angle-double-down"></i> 展开全文'
            : '<i class="fa fa-angle-double-up"></i> 收起';
    });

    requestAnimationFrame(refreshToggle);
    // 中文字体加载完成后高度会变，再校一次
    if(document.fonts && document.fonts.ready){ document.fonts.ready.then(refreshToggle); }
}

function escapeHtml(str){
    if(!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 删除条目
function deleteItem(cat, key){
    const arr = data[cat];
    if(!Array.isArray(arr)) return;
    const idx = itemPos(cat, key);
    if(idx < 0){ alert('未找到该条目，可能已被删除，请刷新页面'); return; }
    if(!confirm("确定删除这条设定？")) return;
    const t = arr[idx];
    const removedList = (cat === 'traitlib') ? '_removedTraits' : (cat === 'skill' ? '_removedSkills' : '');
    if(removedList && t && t.title){
        const removed = JSON.parse(localStorage.getItem(removedList)||'[]');
        if(removed.indexOf(t.title) < 0){ removed.push(t.title); }
        localStorage.setItem(removedList, JSON.stringify(removed));
    }
    arr.splice(idx,1);
    saveStorage();
    renderList(cat);
}
// 定位条目：兼容旧的传下标方式，优先用 uid
function itemPos(cat, key){
    const arr = data[cat];
    if(!Array.isArray(arr)) return -1;
    if(key === undefined || key === null || key === '') return -1;
    const s = String(key);
    if(/^-?\d+$/.test(s)){
        const i = parseInt(s,10);
        if(i >= 0 && i < arr.length && arr[i] && arr[i].uid === undefined) return i;
    }
    for(let i=0;i<arr.length;i++){
        if(arr[i] && String(arr[i].uid) === s) return i;
    }
    return -1;
}

            lab.className = 'inline-flex items-center gap-1 text-xs bg-slate-100 hover:bg-slate-200 rounded px-2 py-1 cursor-pointer';

        const rbBox = document.getElementById('raceBranchesRows');

        jobsBox.innerHTML = '';
        const curJobs = Array.isArray(item.jobs) ? item.jobs : (item.drops && !Array.isArray(item.drops) ? [item.drops] : []);
        const itemHasLv = curJobs.some(j => j && typeof j === 'object' && (j.min !== undefined || j.max !== undefined));
        curJobs.forEach(j=>addJobRow(

// 按分支名从职业图鉴实际保存的数据中查找等级（未配置返回 null）
function findJobLevel(name){
    if(!name) return null;
    for(const r of (data.element||[])){
        const jobs = Array.isArray(r.jobs) ? r.jobs : [];
        for(const jb of jobs){
            const nm = typeof jb === 'string' ? jb : (jb && jb.name || '');
            if(nm === name){
                if(typeof jb === 'string') return null;
                return {min: jb.min !== undefined ? jb.min : 1, max: jb.max !== undefined ? jb.max : 100};
            }
        }
    }
    return null;
}

// ===== 角色技能多选（数据源：角色设定 → 技能图鉴）=====
let charSkillSel = {active:[], passive:[], life:[]};
let charSkillPick = 'active';
const CHAR_SKILL_KINDS = ['active','passive','life'];

function findSkillObj(name){
    return (data.skill||[]).find(x=>x && (x.title||'') === name) || null;
}
function charSkillKindOfName(name){
    const o = findSkillObj(name);
    return o ? skillKindOf(o) : 'active';
}
// 回填：按技能图鉴里的实际分类，把角色已选技能分到三类
function loadCharSkillSel(item){
    charSkillSel = {active:[], passive:[], life:[]};
    (Array.isArray(item && item.skills) ? item.skills : []).forEach(nm=>{
        if(!nm) return;
        const k = charSkillKindOfName(nm);
        if(charSkillSel[k].indexOf(nm) < 0) charSkillSel[k].push(nm);
    });
    charSkillPick = 'active';
    const box = document.getElementById('charSkillSearch');
    if(box) box.value = '';
    renderCharSkillPicker();
}
function setCharSkillPick(k){
    charSkillPick = k;
    document.querySelectorAll('#charSkillsField .skill-picker-tab').forEach(b=>{
        b.classList.toggle('active', b.dataset.ck === k);
    });
    renderCharSkillPicker();
}
function charSkillToggle(name, on){
    const k = charSkillKindOfName(name);
    const arr = charSkillSel[k];
    const i = arr.indexOf(name);
    if(on && i < 0) arr.push(name);
    if(!on && i >= 0) arr.splice(i,1);
    renderCharSkillPicker();
}
function charSkillDrop(name){
    CHAR_SKILL_KINDS.forEach(k=>{
        const i = charSkillSel[k].indexOf(name);
        if(i >= 0) charSkillSel[k].splice(i,1);
    });
    renderCharSkillPicker();
}
function charSkillTotal(){
    return CHAR_SKILL_KINDS.reduce((s,k)=>s + charSkillSel[k].length, 0);
}
function renderCharSkillPicker(){
    const optBox = document.getElementById('charSkillOptions');
    const selBox = document.getElementById('charSkillSelected');
    if(!optBox || !selBox) return;
    const lib = Array.isArray(data.skill) ? data.skill : [];

    // 分类按钮上的数量
    CHAR_SKILL_KINDS.forEach(k=>{
        const el = document.getElementById('ckCnt-' + k);
        if(el) el.textContent = charSkillSel[k].length ? ' ' + charSkillSel[k].length : '';
    });
    const cntEl = document.getElementById('charSkillCount');
    if(cntEl) cntEl.textContent = '已选 ' + charSkillTotal();

    // 已选标签（跨分类，点 × 取消）
    const chosen = [];
    CHAR_SKILL_KINDS.forEach(k=>charSkillSel[k].forEach(nm=>chosen.push({name:nm, kind:k})));
    selBox.innerHTML = chosen.length
        ? chosen.map(c=>`<span class="skill-chip">${escapeHtml(c.name)}<button type="button" title="取消选择" onclick="charSkillDrop('${String(c.name).replace(/'/g,"\\'")}')">×</button></span>`).join('')
        : '<span class="ph">尚未选择技能，在下方勾选即可（可多选）</span>';

    // 候选列表：只显示当前分类，支持搜索
    const kw = (document.getElementById('charSkillSearch') || {}).value || '';
    const keyword = kw.trim().toLowerCase();
    const list = lib.filter(x=>x && skillKindOf(x) === charSkillPick);
    const shown = keyword ? list.filter(x=>(x.title||'').toLowerCase().indexOf(keyword) >= 0) : list;
    if(!shown.length){
        optBox.innerHTML = '<span class="skill-picker-empty">'
            + (list.length ? '没有匹配的技能' : '技能图鉴里还没有「' + (SKILL_KIND_META[charSkillPick] || {label:''}).label + '」，请先到「角色设定 → 技能图鉴」添加')
            + '</span>';
        return;
    }
    optBox.innerHTML = shown.map(x=>{
        const nm = x.title || '';
        const on = charSkillSel[charSkillPick].indexOf(nm) >= 0;
        const tip = (x.content || '').replace(/"/g,'&quot;').replace(/\n/g,' ');
        const esc = String(nm).replace(/'/g,"\\'");
        return `<label class="skill-opt${on ? ' on' : ''}" title="${tip}">`
            + `<input type="checkbox" ${on ? 'checked' : ''} onchange="charSkillToggle('${esc}', this.checked)">`
            + `${escapeHtml(nm)}</label>`;
    }).join('');
}
// 角色卡片：按技能分类显示徽章（带详细说明 tooltip）
function charSkillsBadge(item){
    const names = Array.isArray(item && item.skills) ? item.skills.filter(Boolean) : [];
    if(!names.length) return '';
    const groups = {active:[], passive:[], life:[]};
    names.forEach(nm=>{ groups[charSkillKindOfName(nm)].push(nm); });
    return CHAR_SKILL_KINDS.map(k=>{
        const meta = SKILL_KIND_META[k] || {};
        const arr = groups[k];
        if(!arr.length) return '';
        const chips = arr.map(nm=>{
            const o = findSkillObj(nm);
            const tip = (o && o.content ? String(o.content) : '').replace(/"/g,'&quot;').replace(/\n/g,' ');
            return `<span class="inline-block text-xs ${meta.cls} rounded px-2 py-0.5 mb-1 ml-1 cursor-help" title="${tip}">${meta.icon} ${escapeHtml(nm)}</span>`;
        }).join('');
        return `<span class="skill-group"><span class="glabel">${meta.label}</span>${chips}</span>`;
    }).join('');
}

function jobRangeColor(hi){
    hi = parseInt(hi,10) || 1;
    if(hi >= 100) return 'bg-red-500 text-white';
    if(hi >= 81) return 'bg-gradient-to-r from-amber-300 to-yellow-200 text-amber-900';
    if(hi >= 61) return 'bg-purple-200 text-purple-800';
    if(hi >= 41) return 'bg-sky-200 text-sky-800';
    if(hi >= 21) return 'bg-emerald-200 text-emerald-800';
    return 'bg-slate-200 text-slate-700';
}
// 职业分支卡片徽章：职业名 + Lv.固定等级区间（同排分开；未配置默认 1-100）
function jobBadgeHtml(j){
    const nm = typeof j === 'string' ? j : (j && j.name || '');
    // 无等级分支（纯字符串 / 无 min-max 的对象）只显示职业名，不显示 Lv
    const hasLv = !(typeof j === 'string') && j && (j.min !== undefined || j.max !== undefined);
    let html = '<span class="inline-block rounded px-1.5 py-0.5 mr-1 bg-indigo-100 text-indigo-700">' + escapeHtml(nm) + '</span>';
    if(hasLv){
        const lo = j.min !== undefined ? j.min : 1;
        const hi = j.max !== undefined ? j.max : 100;
        html += '<span class="inline-block rounded px-1.5 py-0.5 mr-1 font-bold ' + jobRangeColor(hi) + '">Lv.' + escapeHtml(String(lo)) + '-' + escapeHtml(String(hi)) + '</span>';
    }
    return html;
}

// 添加一行职业分支（名称 + 可选等级；showLv=false 时不渲染等级输入 → 无等级分支）
function addJobRow(name, min, max, showLv){
    const box = document.getElementById('jobsRows');
    if(!box) return;
    const hasLv = showLv !== false;
    const hasStored = (min !== undefined && min !== null && min !== '');
    let lo, hi;
    if(hasStored){ // 编辑已有条目：以保存的等级为准
        lo = parseInt(min,10);
        hi = parseInt(max,10);
    } else { // 新增空行：默认 1-100，由用户手动填写
        lo = 1; hi = 100;
    }
    const row = document.createElement('div');
    row.className = "flex gap-2 items-center flex-wrap";
    const lvHtml = hasLv ? `
        <span class="text-xs text-slate-400">等级</span>
        <input type="number" class="job-min w-14 text-xs border rounded px-1 py-1 text-right" min="1" max="100" value="${lo}">
        <span class="text-slate-400 text-xs">-</span>
        <input type="number" class="job-max w-14 text-xs border rounded px-1 py-1 text-right" min="1" max="100" value="${hi}">
        <span class="job-range-tip text-xs font-bold px-1.5 py-0.5 rounded ${jobRangeColor(hi)}">Lv.${lo}-${hi}</span>` : '';
    row.innerHTML = `
        <span class="drag-handle cursor-move text-slate-400 select-none px-1" title="按住此处拖动排序">≡</span>
        <input type="text" class="job-name flex-1 min-w-[130px] border rounded px-2 py-1.5 text-sm" placeholder="职业分支（如：魔法学徒）" value="${escapeHtml(name||'')}">
        ${lvHtml}
        <button type="button" onclick="this.parentNode.remove()" class="text-sm px-2 py-1 bg-red-100 text-red-600 rounded hover:bg-red-200"><i class="fa fa-times"></i></button>
    `;
    const nameIn = row.querySelector('.job-name');
    const minN = row.querySelector('.job-min');
    const maxN = row.querySelector('.job-max');
    const tip = row.querySelector('.job-range-tip');
    if(minN && maxN && tip){
        const clamp = v => { v = parseInt(v,10); if(isNaN(v)) return 1; if(v < 1) return 1; if(v > 100) return 100; return v; };
        const sync = function(){
            let lo2 = clamp(minN.value);
            let hi2 = clamp(maxN.value);
            if(lo2 > hi2) lo2 = hi2; // 仅影响提示，不回写输入框，避免改最高级时最低级被强行改掉
            tip.textContent = 'Lv.' + lo2 + '-' + hi2;
            tip.className = 'job-range-tip text-xs font-bold px-1.5 py-0.5 rounded ' + jobRangeColor(hi2);
        };
        nameIn.addEventListener('input', ()=>{ sync(); });
        minN.addEventListener('input', sync);
        maxN.addEventListener('input', sync);
    }
    // 上下拖拽排序：只通过行首手柄拖拽，不影响输入框内文字选择
    const handle = row.querySelector('.drag-handle');
    handle.draggable = true;
    handle.addEventListener('dragstart', e=>{
        window._dragJobRow = row;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', 'jobrow');
    });
    row.addEventListener('dragover', e=>{ e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
    row.addEventListener('drop', e=>{
        e.preventDefault();
        const dragRow = window._dragJobRow;
        if(!dragRow || dragRow === row) return;
        const rows = Array.from(row.parentNode.children);
        const a = rows.indexOf(dragRow), b = rows.indexOf(row);
        if(a < b) row.parentNode.insertBefore(dragRow, row.nextSibling);
        else row.parentNode.insertBefore(dragRow, row);
    });
    row.addEventListener('dragend', ()=>{ window._dragJobRow = null; });
    box.appendChild(row);
}

    if(isNew){
        data[cat].push({uid: 'it' + (++__uidSeq) + '_' + Date.now().toString(36)});
        idx = data[cat].length - 1;
    }
    if(idx < 0 || !data[cat][idx]){ alert('保存失败：条目不存在，请刷新页面后重试'); return; }
    const item = data[cat][idx];
    item.title = title;
    if(cat === 'hero' || cat === 'support'){
        item.race = race;
        item.weapon = weapon;
        item.branch = document.getElementById('editBranch').value.trim();
        item.job = document.getElementById('editJob').value.trim();
        item.jobBranch = document.getElementById('editJobBranch').value.trim();
    }
    if(cat === 'weapon'){
        item.kind = kind;
        // 收集武器材料：checkbox 多选，等级以素材库为准（只调用，不新增/不修改素材库）
        item.materials = Array.from(document.querySelectorAll('.mat-cb:checked')).map(cb=>{
            const a = (data.asset||[]).find(x=>(x.title||'').trim()===cb.value);
            return {name: cb.value, quality: a ? (a.quality||'普通') : '普通'};
        });
        item.weaponSkill = document.getElementById('editWeaponSkill').value.trim();
        item.image = document.getElementById('editImage').value.trim();
        item.sources = sources;
        // 只保留标准属性（治愈/净化/结界），清除木金光等旧自定义值
        item.attributes = attributes.filter(a=>WEAPON_ATTRIBUTES.includes(a));
        item.abilities = abilities.filter(a=>ABILITIES.includes(a));
        delete item.ability;  // 字段更名：单值能力 → 多选能力数组
        delete item.material;  // 字段更名：单值材料 → 多选材料数组
        delete item.attribute; // 字段更名：单值属性 → 多选属性数组
        delete item.source;   // 字段更名：单值来源 → 多选来源数组
        delete item.quality;  // 字段更名：武器品质 → 武器来源
    }
    if(['monster','mineral','flora','weapon'].indexOf(cat) >= 0){
        item.genre = document.getElementById('editCateGenre').value || '西式';
    }
    if(cat === 'asset'){
        item.genre = document.getElementById('editAssetGenre').value || '西式素材';
        item.quality = assetQuality;
        // 素材库等级变更同步回三大图鉴（怪物/矿物/植被）：同名掉落更新等级
        if(assetQuality){
            const nm = (item.title||'').trim();
            ['monster','mineral','flora'].forEach(catName=>{
                (data[catName]||[]).forEach(m=>{
                    if(Array.isArray(m.drops)){
                        m.drops.forEach(d=>{
                            if(d && typeof d === 'object' && (d.name||'').trim() === nm){
                                d.quality = assetQuality;
                            }
                        });
                    }
                });
            });
            // 武器材料同步：同名材料更新等级
            (data.weapon||[]).forEach(w=>{
                if(Array.isArray(w.materials)){
                    w.materials.forEach(m=>{
                        if(m && typeof m === 'object' && (m.name||'').trim() === nm){
                            m.quality = assetQuality;
                        }
                    });
                }
            });
        }
    }
    if(cat === 'monster' || cat === 'mineral' || cat === 'flora'){
        const rows = Array.from(document.querySelectorAll('#dropsRows .drop-name'));
        const dropMap = new Map();
        rows.forEach(r=>{
            const name = (r.value||'').trim();
            if(!name) return;
            const quality = (r.parentNode.querySelector('.drop-quality').value||'').trim() || '普通';
            dropMap.set(name, quality); // 同名取最后一行等级
        });
        item.drops = Array.from(dropMap, ([name, quality])=>({name:name, quality:quality}));
        // 同步素材库：同名素材更新等级，无同名自动新增
        item.drops.forEach(d=>{
            const exist = data.asset.find(a=>(a.title||'').trim() === d.name);
            if(exist){ exist.quality = d.quality; }
            else { data.asset.push({title:d.name, quality:d.quality, content:''}); }
        });
    }
    if(cat === 'element'){
        const rows = Array.from(document.querySelectorAll('#jobsRows .job-name'));
        const jobs = [];
        rows.forEach(r=>{
            const name = (r.value||'').trim();
            if(!name) return;
            if(jobs.some(x=>x.name===name)) return;
            const row = r.closest('.flex');
            const minN = row ? row.querySelector('.job-min') : null;
            if(minN){ // 等级模式：保存 min/max
                let lo = parseInt(minN.value,10);
                let hi = parseInt((row.querySelector('.job-max')||{}).value,10);
                if(isNaN(lo) || lo < 1) lo = 1;
                if(isNaN(hi) || hi > 100) hi = 100;
                if(hi < 1) hi = 1;
                if(lo > hi) lo = hi;
                jobs.push({name:name, min:lo, max:hi});
            } else { // 无等级模式：只保存分支名
                jobs.push({name:name});
            }
        });
        item.jobs = jobs;
        delete item.drops; // 字段更名：掉落素材 → 职业分支
    }
    if(cat === 'ability'){
        item.type = document.getElementById('editAbilityType').value || 'fixed';
        item.trait = document.getElementById('editTrait').value.trim();
    }
    if(cat === 'traitlib'){
        delete item.grade; // 状态图鉴（BUFF大全/职业BUFF/套装BUFF）不再有等级
        item.genre = document.getElementById('editTraitGenre').value || 'BUFF';
    }
    if(cat === 'raceTitle'){
        item.grade = document.getElementById('editGrade').value || '普通';
    }
    if(cat === 'skill'){
        item.kind = document.getElementById('editSkillKind').value || 'active';
        if(item.kind === 'life'){
            item.cate = document.getElementById('editLifeCate').value || 'adventure';
        }else{
            delete item.cate;  // 非生活技能不带子分类
        }
    }
    if(cat === 'hero' || cat === 'support'){
        item.genre = document.getElementById('editCharGenre').value || '西式';
        const boxes = document.querySelectorAll('.char-trait-cb:checked');
        item.traits = Array.from(boxes).map(b=>b.value);
        // 技能：按 主动 / 被动 / 生活 三类保存（数据源为技能图鉴）
        item.skills = charSkillSel.active.concat(charSkillSel.passive, charSkillSel.life);
        const lv = parseInt(document.getElementById('editLevel').value,10);
        item.level = isNaN(lv) ? null : Math.max(1, Math.min(100, lv));
    }
    if(cat === 'race'){
        const rows = Array.from(document.querySelectorAll('#raceBranchesRows .race-branch-name'));
        const branches = [];
        rows.forEach(r=>{
            const name = (r.value||'').trim();
            if(name && !branches.includes(name)) branches.push(name);
        });
        item.branches = branches;
        delete item.branch; // 字段更名：单值种族分支 → 多选数组
        item.standing = document.getElementById('editRaceStand').value.trim();
        item.rivalRaces = Array.from(document.querySelectorAll('.rival-race-cb:checked')).map(c=>c.value);
        delete item.rivalRace;
    }
    item.content = content;
    /* 武器技能（技能图鉴 → kind=weapon）：登记所属武器，并在该武器上回写技能名 */
    if(cat === 'skill' && item.kind === 'weapon'){
        const _sel = document.getElementById('editSkillWeapon');
        item.weapon = _sel ? _sel.value.trim() : '';
        delete item.cate;
        if(item.weapon){
            const _w = (data.weapon||[]).filter(function(x){ return x && String(x.title||'').trim() === item.weapon; })[0];
            if(_w) _w.weaponSkill = item.title || '';
        }
    }
    saveStorage();
    renderList(cat);
    closeModal();
}

    const c = item && item.cate;
    if(c && LIFE_CATES[c]) return c;
    const t = (item && item.title) || '';
    const s = (item && item.content) || '';
    const hit = function(arr){ return arr.some(k=>t.indexOf(k) >= 0 || s.indexOf(k) >= 0); };
    if(hit(['采','伐','矿','渔','钓','猎','剥','淘','种植','耕作','草药','药材','挖掘','摘'])) return 'gather';
    if(hit(['制','造','炼','锻','缝','织','烹饪','烹调','酿','附魔','铭','珠','工','修','药散','炼丹','打铁','制药'])) return 'craft';
    if(hit(['交涉','议价','估价','情','宴','茶','书','棋','占','赌','表演','唱','酒馆','人脉','商','账'])) return 'social';

function bgProbe(url){
  return new Promise(function(resolve){
    const im = new Image();
    let done = false;
    const finish = function(ok){ if(done) return; done = true; resolve(ok); };
    im.onload = function(){ finish(true); };
    im.onerror = function(){ finish(false); };
    setTimeout(function(){ finish(false); }, 6000);
    im.src = url;
  });
}
function bgUrl(name){
  if(/^(https:|http:|data:)/i.test(name)) return name;   /* 完整网址，直接用 */
  if(name.charAt(0) === '/') return name;                /* 以 / 开头的绝对路径 */
  if(name.indexOf('/') >= 0) return name;                /* 已带目录（如 assets/Background/bg.jpg）直接用，不要再拼前缀 */
  return BG_DIR + encodeURIComponent(name);              /* 只写了文件名 → 去 assets/Background/ 找 */
}
function bgPickRandom(){
  if(bgOk.length <= 1) return 0;
  let i = Math.floor(Math.random() * bgOk.length);
  if(i === bgIdx) i = (i + 1) % bgOk.length;    /* 尽量不连着放同一张 */
  bgIdx = i;
  return i;
}
function bgShow(i){
  const name = bgOk[i];
  if(!name) return;
  const a = document.getElementById('bgA'), b = document.getElementById('bgB');
  if(!a || !b) return;
  const incoming = bgUsingA ? b : a;
  const outgoing = bgUsingA ? a : b;
  incoming.style.backgroundImage = "url('" + bgUrl(name) + "')";
  incoming.classList.add('on');
  outgoing.classList.remove('on');
  bgUsingA = !bgUsingA;
}
async function bgInit(){
  const stack = document.getElementById('bgStack');
  if(!stack || !BG_LIST.length) return;
  const ok = [];
  for(const name of BG_LIST){
    let good = false;
    try{ good = await bgProbe(bgUrl(name)); }catch(e){ good = false; }
    if(!good) continue;
    ok.push(name);
    bgOk = ok.slice();                            /* 可用列表随探测进度增长 */
    if(ok.length === 1) bgShow(bgPickRandom());   /* 第一张可用就立刻显示，不再等 9 张全探完 */
  }
  if(!ok.length){
    sakuraWarn('[背景] BG_LIST 里的图片都没找到，请检查 ' + BG_DIR + ' 文件夹与文件名');
    return;
  }
  if(ok.length > 1) setInterval(function(){ bgShow(bgPickRandom()); }, BG_INTERVAL);
  sakuraLog('[背景] 已启用 ' + ok.length + ' 张，每 ' + (BG_INTERVAL/1000) + ' 秒随机切换');
}
bgInit();

// ========== 动态粒子 / 萤火虫效果 ==========
const particleCanvas = document.createElement('canvas');
particleCanvas.id = 'bgParticles';
particleCanvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:2;';
document.body.appendChild(particleCanvas);
const pctx = particleCanvas.getContext('2d');
function resizeParticleCanvas(){ particleCanvas.width = window.innerWidth; particleCanvas.height = window.innerHeight; }
window.addEventListener('resize', function(){ resizeParticleCanvas(); initFireflies(); }); resizeParticleCanvas();

/* ---------- 萤火虫：飘动 + 闪烁 + 上下浮动；点击页面迸出一小簇 ---------- */
const FIREFLY_COUNT = 46;            /* 萤火虫数量，想更多就调大 */
const FIREFLY_HUES = [
  'rgba(253,230,138,',   /* 暖黄 */
  'rgba(190,242,100,',   /* 嫩绿黄 */
  'rgba(167,243,208,'    /* 淡青绿 */
];
let fireflies = [];
let particleRunning = false;        /* 画布动画是否已启动 */

function ffSpawn(seedRandom){
  const w = particleCanvas.width, h = particleCanvas.height;
  return {
    x: Math.random() * w,
    y: Math.random() * h,
    r: 1.1 + Math.random() * 1.9,                     /* 光点半径 */
    vx: (Math.random() - 0.5) * 0.32,                 /* 横向缓慢漂移 */
    vy: -0.06 - Math.random() * 0.16,                 /* 整体略微上浮 */
    phase: Math.random() * Math.PI * 2,                /* 闪烁相位 */
    blink: 0.5 + Math.random() * 1.5,                  /* 闪烁速度 */
    bob: 0.5 + Math.random() * 1.4,                   /* 上下浮动速度 */
    bobAmp: 4 + Math.random() * 12,                   /* 浮动幅度 */
    hue: FIREFLY_HUES[Math.floor(Math.random() * FIREFLY_HUES.length)],
    base: 0.45 + Math.random() * 0.5                  /* 基础亮度 */
  };
}
function initFireflies(){
  fireflies = [];
  for(let i = 0; i < FIREFLY_COUNT; i++) fireflies.push(ffSpawn());
  if(!particleRunning) animateParticles();
}
function animateParticles(){
  particleRunning = true;
  const w = particleCanvas.width, h = particleCanvas.height;
  const t = performance.now() / 1000;
  pctx.clearRect(0, 0, w, h);

  /* —— 萤火虫：柔和光晕 + 明灭闪烁 —— */
  pctx.globalCompositeOperation = 'lighter';          /* 叠加发光 */
  for(let i = 0; i < fireflies.length; i++){
    const f = fireflies[i];
    f.x += f.vx;
    f.y += f.vy + Math.sin(t * f.bob + f.phase) * 0.12;   /* 上下浮动 */
    /* 出界后从另一侧绕回，保持画面始终有萤火虫 */
    if(f.x < -20) f.x = w + 20; else if(f.x > w + 20) f.x = -20;
    if(f.y < -20) f.y = h + 20; else if(f.y > h + 20) f.y = -20;

    /* 闪烁：两个不同频率的正弦叠加，忽明忽暗更自然 */
    const tw = 0.5 + 0.5 * Math.sin(t * f.blink + f.phase);
    const tw2 = 0.5 + 0.5 * Math.sin(t * f.blink * 0.37 + f.phase * 1.7);
    const alpha = Math.max(0.05, Math.min(1, f.base * (0.35 + 0.65 * tw) * (0.6 + 0.4 * tw2)));

    pctx.globalAlpha = alpha;
    pctx.shadowBlur = 16;
    pctx.shadowColor = f.hue + '0.95)';
    pctx.fillStyle = f.hue + '1)';
    pctx.beginPath();
    pctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    pctx.fill();
    /* 核心再点一个小亮点，更像萤火 */
    pctx.globalAlpha = alpha * 0.9;
    pctx.fillStyle = 'rgba(255,255,240,1)';
    pctx.beginPath();
    pctx.arc(f.x, f.y, f.r * 0.42, 0, Math.PI * 2);
    pctx.fill();
  }
  pctx.shadowBlur = 0;

  pctx.globalCompositeOperation = 'source-over';
  pctx.globalAlpha = 1;

  requestAnimationFrame(animateParticles);           /* 常驻动画 */
}
initFireflies();


(function(){
    // 预置数据源已全部移除：不再播种任何默认条目，只保留用户自己新增的内容。
    // 兼容旧存档：一次性迁移 + 清理已废弃的分类。
    const removedSkills = JSON.parse(localStorage.getItem('_removedSkills')||'[]');
    /* once 包装：迁移标记写入后自动清理，避免这些键永久占位 */
    function once(key, fn){
        if(localStorage.getItem(key)) return;
        try{ fn(); }catch(e){}
        localStorage.setItem(key,'1');
    }
    once('_traitsSeeded_v2', function(){ if(!Array.isArray(data.traitlib)) data.traitlib = []; });
    once('_skillLibSeeded_v3', function(){ if(!Array.isArray(data.skill)) data.skill = []; });
    // 一次性删除「社交类」「冒险类」生活技能（含旧数据里已存在的）
    once('_lifeCatesRemoved_v1', function(){
        (data.skill||[]).forEach(x=>{
            if(x && x.kind === 'life' && LIFE_CATES_REMOVED.indexOf(lifeCateOf(x)) >= 0 && x.title && removedSkills.indexOf(x.title) < 0){
                removedSkills.push(x.title);   // 记入永久删除名单，刷新不会被补回
            }
        });
        localStorage.setItem('_removedSkills', JSON.stringify(removedSkills));
        data.skill = (data.skill||[]).filter(x=>!(x && x.kind === 'life' && LIFE_CATES_REMOVED.indexOf(lifeCateOf(x)) >= 0));
    });
    delete data.lifeskill;   // 不再使用该字段，导出时也不带
    // 已删除的模块：故事提纲 / 人物关系图，从存档中彻底清除
    once('_removedOutlineRelation_v1', function(){
        delete data.outline;

})();

function clearCurrentSkillKind(){
    const label = (SKILL_KIND_META[skillKind] ? SKILL_KIND_META[skillKind].label : '当前分类');
    const targets = (data.skill||[]).filter(x=>x && skillKindOf(x) === skillKind);
    if(!targets.length){ alert('当前分类下没有条目'); return; }
    if(!confirm('确定清空「' + label + '」下的 ' + targets.length + ' 条技能？删除后不会自动恢复。')) return;
    // 记入永久删除名单，刷新后不会被种子补回
    const removed = JSON.parse(localStorage.getItem('_removedSkills')||'[]');
    targets.forEach(t=>{ if(t.title && removed.indexOf(t.title) < 0) removed.push(t.title); });
    localStorage.setItem('_removedSkills', JSON.stringify(removed));
    data.skill = (data.skill||[]).filter(x=>!x || skillKindOf(x) !== skillKind);
    saveStorage();
    renderList('skill');
}

// ========== 外观外壳：顶栏导航 / 搜索 / 时钟 / 统计 ==========
(function(){
  /* 顶栏导航 ↔ 编辑器标签页联动
     导航项由页面里真实的 .tab-btn[data-tab] 自动生成 ——
     以后增删标签页（例如加回"素材库"）导航会自动跟着变，不用改这里 */
  const LIST_MAP = {
    character:  ['list-hero','list-support'],
    roleset:    ['list-race','list-element','list-skill','list-traitlib'],
    collection: ['list-monster','list-mineral','list-flora','list-weapon'],
    asset:      ['list-asset']
  };

  /* 搜索：全局匹配条目，自动跳转到所属面板后过滤显示 */
  const search = document.getElementById('heroSearch');
  function activeTab(){
    const cur = (document.querySelector('.tab-btn.border-primary') || {}).dataset;
    return cur ? cur.tab : 'character';
  }
  function targetsFor(tab){
    return (LIST_MAP[tab] || []).map(id=>document.getElementById(id)).filter(Boolean);
  }
  /* 分类 -> [主 tab, 子面板切换函数]。
     注意：race/element/skill/traitlib 的实际列表容器都在 #panel-character 里，
     #panel-roleset 只是个空按钮壳，所以主 tab 一律是 'character'。 */
  const CAT_PANEL = {
    hero:      ['character',  ()=>setCharSub('hero')],
    support:   ['character',  ()=>setCharSub('support')],
    race:      ['character',  ()=>setRolesetSub('race')],
    element:   ['character',  ()=>setRolesetSub('element')],
    skill:     ['character',  ()=>setRolesetSub('skill')],
    traitlib:  ['character',  ()=>setRolesetSub('traitlib')],
    raceTitle: ['character',  ()=>{ setTraitGenre('title'); setRolesetSub('traitlib'); }],
    monster:   ['collection',()=>setCollectionSub('monster')],
    mineral:   ['collection',()=>setCollectionSub('mineral')],
    flora:     ['collection', ()=>setCollectionSub('flora')],
    weapon:    ['collection',()=>setCollectionSub('weapon')]
  };
  function applyFilter(){
    const kw = (search ? search.value : '').trim().toLowerCase();
    let hit = 0, total = 0;
    /* 只过滤当前可见的列表容器（同一时刻只有一个 list-* 不 hidden） */
    document.querySelectorAll('[id^="list-"]').forEach(box=>{
      if(box.classList.contains('hidden')) return;
      Array.prototype.forEach.call(box.children, card=>{
        const txt = (card.textContent || '').toLowerCase();
        const show = !kw || txt.indexOf(kw) >= 0;
        card.style.display = show ? '' : 'none';
        total++;
        if(show && kw) hit++;
      });
    });
    if(search) search.title = kw ? ('匹配 ' + hit + ' / ' + total + ' 条') : '';
  }
  function doFilter(){
    const kw = (search ? search.value : '').trim().toLowerCase();
    if(kw){
      /* 全局找第一个匹配条目的分类，自动切到所属面板 */
      let target = null;
      for(const cat in CAT_PANEL){
        if((data[cat]||[]).some(x => x && (x.title||'').toLowerCase().indexOf(kw) >= 0)){ target = cat; break; }
      }
      if(target){
        const [wantTab, switchSub] = CAT_PANEL[target];
        if(activeTab() !== wantTab){
          const btn = document.querySelector('.tab-btn[data-tab="'+wantTab+'"]');
          if(btn) btn.click();
        }
        switchSub();
      }
    }
    setTimeout(applyFilter, 0);
  }
  /* 搜索输入防抖：快速连续打字只在停顿后执行一次，避免每键都全量重渲染 */
  let _searchTimer = null;
  if(search){
    search.addEventListener('input', ()=>{
      if(_searchTimer) clearTimeout(_searchTimer);
      _searchTimer = setTimeout(doFilter, 200);
    });
  }
  /* 切主 tab 时只需按当前关键词过滤可见面板，不需要重新全局搜索跳转 */
  document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click', ()=>setTimeout(applyFilter, 30)));

  /* 底部时钟 */
  const clock = document.getElementById('footClock');
  const year = document.getElementById('footYear');
  if(year) year.textContent = new Date().getFullYear();
  function tick(){
    if(!clock) return;
    const d = new Date();
    const p = n => (n < 10 ? '0' : '') + n;
    clock.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  tick(); setInterval(tick, 1000);

})();

pruneLifeCateButtons();  // 移除已废弃的分类按钮（社交类 / 冒险类）

renderAll();
setCharSub('hero');
</script>

<script>
/* 页面视图：首页（头像卡 + 播放器 + 歌词）/ 项目（四大图鉴）。默认停在首页，会记住上次所在页。 */

function setView(v, silent){
  currentView = (v === 'projects') ? 'projects'
              : (v === 'gallery')  ? 'gallery'
              : 'home';
  /* 切换页面时先收起菜单，避免「项目」高亮残留 */
  const _m = document.getElementById('projMenuPanel');
  if(_m && typeof projMenuOpen !== 'undefined' && projMenuOpen){
    projMenuOpen = false;
    _m.classList.remove('show');
    _m.style.pointerEvents = 'none';
    
  }
  const home = document.getElementById('view-home');
  const proj = document.getElementById('view-projects');
  const gal  = document.getElementById('view-gallery');
  if(home) home.style.display = (currentView === 'home') ? '' : 'none';
  if(proj) proj.style.display = (currentView === 'projects') ? '' : 'none';
  if(gal)  gal.style.display  = (currentView === 'gallery') ? '' : 'none';
  const th = document.getElementById('vtab-home'), tt = document.getElementById('vtab-gallery'), tp = document.getElementById('vtab-projects');
  if(th) th.classList.toggle('active', currentView === 'home' && !projMenuOpen);
  if(tt) tt.classList.toggle('active', currentView === 'gallery' && !projMenuOpen);
  /* 「项目」高亮 = 菜单打开时，或当前就在项目页 */
  if(tp) tp.classList.toggle('active', projMenuOpen || currentView === 'projects');
  /* 头像卡 + 播放器：只在首页出现 */
  const hh = document.getElementById('homeHero');
  if(hh) hh.style.display = (currentView === 'home') ? '' : 'none';
  /* 搜索框过滤的是项目页里的卡片，首页/图库不必占位置 */
  const hs = document.getElementById('heroSearchWrap');
  if(hs) hs.style.display = (currentView === 'projects') ? '' : 'none';
  /* 歌词条属于首页 */
  const ly = document.getElementById('lyricBar');
  if(ly){ ly.style.display = (currentView === 'home') ? '' : 'none'; ly.style.marginTop = '0'; }
  /* 图库只在图库页需要重建（图片是全尺寸懒加载，首次进入才拉） */
  if(currentView === 'gallery'){ try{ buildGallery(); }catch(e){} }
  /* 项目菜单在首页/图库/项目页都能用 */
  if(currentView === 'projects') selectProjectTab();   /* 进项目页时确保有内容显示，不会一片空白 */
  else selectProjectTabHome();                          /* 其它视图都要隐藏项目面板 */
  if(currentView !== 'projects') closeProjMenu();
  try{ localStorage.setItem('_view', currentView); }catch(e){}
}
/* 离开项目页时把「项目」容器隐藏。
   这里不能改 view-home / view-gallery 的显隐 —— 那是 setView 的职责，
   否则切到图库时会被这里重新显示首页，把图库盖住。 */
function selectProjectTabHome(){
  const proj = document.getElementById('view-projects');
  if(proj) proj.style.display = 'none';
}

/* 确保项目页里"当前标签"的面板是显示状态。
   点「项目」进页面时如果没有任何面板可见，就会一片空白 —— 这里兜底。 */
function selectProjectTab(){
  const panels = Array.prototype.slice.call(document.querySelectorAll('.tab-panel'));
  if(!panels.length) return;
  const visible = panels.some(function(p){
    if(p.classList.contains('hidden')) return false;
    /* 还要确认它真的渲染出来了（没被 display:none / 零高度压没） */
    try{
      const cs = window.getComputedStyle ? window.getComputedStyle(p) : null;
      if(cs && cs.display === 'none') return false;
      if(!p.offsetHeight && !p.children.length) return false;
    }catch(e){ /* 拿不到样式就当它可见，避免误切换 */ }
    return true;
  });
  if(visible) return;                       /* 已有可见面板，不用动 */
  /* 优先用当前高亮的标签，否则退回第一个标签 */
  const activeBtn = document.querySelector('.tab-btn.border-primary');
  const firstBtn = document.querySelector('.tab-btn[data-tab]');
  const btn = activeBtn || firstBtn;
  const tab = btn && btn.dataset ? btn.dataset.tab : null;
  const target = tab ? document.querySelector('.tab-btn[data-tab="' + tab + '"]') : null;
  if(target){ target.click(); return; }
  /* 连标签都找不到：直接把第一个面板显示出来，绝不留空白 */
  panels.forEach(function(p){ p.classList.add('hidden'); });
  const first = document.getElementById('panel-character') || panels[0];
  if(first) first.classList.remove('hidden');
}
/* ================= 「项目」下拉菜单 =================
   结构：项目 → 小说制作（分组）→ 角色设定 / 综合图鉴 */
const PROJ_MENU_GROUPS = [
  {
    key:'novel',
    ico:'\uD83D\uDCD6',
    label:'小说制作',
    desc:'角色 · 设定 · 图鉴',
    items:[
      { tab:'character',  ico:'\uD83C\uDFAD', label:'角色设定', desc:'主角 / 配角 · 种族职业技能状态' },
      { tab:'collection', ico:'\uD83D\uDC09', label:'综合图鉴', desc:'怪物 / 矿物 / 植被 / 武器' }
    ]
  }
];
let projMenuGroup = '';        /* 当前展开的分组（空＝只看分组列表） */
let projMenuOpen = false;
/* 菜单固定锚定在顶栏的「项目」按钮上 */

function paintProjMenu(){

  if(!panel) return;
  const cur = (document.querySelector('.tab-btn.border-primary') || {}).dataset;

}
function buildProjMenu(){
  const panel = document.getElementById('projMenuPanel');
  if(!panel) return;
  const cur = (document.querySelector('.tab-btn.border-primary') || {}).dataset;
  const activeTab = cur ? cur.tab : '';
  let html = '';
  PROJ_MENU_GROUPS.forEach(function(g){
    const opened = (projMenuGroup === g.key);
    const hasActive = g.items.some(function(it){ return it.tab === activeTab; });
    /* 分组标题行：点一下展开 / 收起它下面的模块（不切页面） */
    html += '<button class="pm-item pm-group' + (hasActive ? ' active' : '') + '" data-group="' + g.key + '" onclick="toggleProjGroup(\'' + g.key + '\')">' +
      '<span class="pm-ico">' + g.ico + '</span>' +
      '<span class="pm-txt"><span class="pm-label">' + g.label + '</span>' +
      '<span class="pm-desc">' + g.desc + '</span></span>' +
      '<i class="fa fa-angle-' + (opened ? 'down' : 'right') + ' pm-go pm-caret"></i></button>';
    if(opened){

/* 展开 / 收起某个分组（只切换层级，不跳页面） */
function toggleProjGroup(key){

/* 从根上防止「点菜单内部」的事件冒泡到页面其它地方。
   之前靠 document 级监听里用 panel.contains(t) 判断，那个引用并不可靠；
   现在直接在面板自身拦截：只要点在面板里，就别再往上冒泡。
   面板内各按钮自己的 onclick 已经先执行完了，所以功能不受影响。 */
function bindProjMenuGuards(){
  const panel = document.getElementById('projMenuPanel');
  if(!panel || panel.__guarded) return;
  panel.__guarded = true;
  panel.addEventListener('click', function(e){
    if(e && e.stopPropagation) e.stopPropagation();
  });
}
/* 把面板抬到 <body> 下，并用内联样式锁死层级与定位方式。
   内联样式优先级最高，任何样式表都无法把它压下去或裁掉。 */
function liftProjMenu(){
  const panel = document.getElementById('projMenuPanel');
  if(!panel) return null;
  if(panel.parentNode !== document.body) document.body.appendChild(panel);
  bindProjMenuGuards();      /* 面板内部点击不再冒泡到页面级逻辑 */
  panel.style.position = 'fixed';
  panel.style.top = '0';
  panel.style.left = '0';
  panel.style.zIndex = '2147483000';      /* 接近 32 位最大值，确保在最上层 */
  panel.style.pointerEvents = projMenuOpen ? 'auto' : 'none';
  return panel;
}

/* 把面板定位到按钮正下方；若右边或下边超出视口就自动收进来 */
function placeProjMenu(){
  /* 菜单固定贴在顶栏「项目」按钮下方 */
  const anchor = document.getElementById('vtab-projects');
  const panel = document.getElementById('projMenuPanel');
  if(!anchor || !panel) return;
  /* 每次定位都重新锁一遍内联样式，确保万无一失 */
  panel.style.position = 'fixed';
  panel.style.zIndex = '2147483000';
  const r = anchor.getBoundingClientRect();
  const pw = panel.offsetWidth || 266;
  const ph = panel.offsetHeight || 240;
  const vw = window.innerWidth || document.documentElement.clientWidth;
  const vh = window.innerHeight || document.documentElement.clientHeight;
  let left = r.left;
  /* 右边收边（窗口窄时避免横向被切掉） */
  if(left + pw > vw - 12) left = Math.max(12, vw - pw - 12);
  /* 下方空间不够就翻到按钮上方 */
  let top = r.bottom + 10;
  if(top + ph > vh - 12){
    const above = r.top - ph - 10;
    top = (above >= 12) ? above : Math.max(12, vh - ph - 12);
  }
  panel.style.transform = 'translate3d(' + Math.round(left) + 'px,' + Math.round(top) + 'px,0)';
}

function toggleProjMenu(e){
  if(e && e.stopPropagation) e.stopPropagation();
  if(e && e.preventDefault) e.preventDefault();
  projMenuOpen = !projMenuOpen;
  const panel = document.getElementById('projMenuPanel');
  if(panel) panel.classList.toggle('show', projMenuOpen);
  const vp = document.getElementById('vtab-projects');
  if(vp) vp.classList.toggle('active', projMenuOpen);
  const vh = document.getElementById('vtab-home');
  if(vh) vh.classList.toggle('active', !projMenuOpen && currentView === 'home');
  if(projMenuOpen){
    const panel = liftProjMenu();   /* 先抬到 body 下并锁死层级 */
    if(panel) panel.style.pointerEvents = 'auto';
    placeProjMenu();                /* 再算位置，避免闪一下 */
    paintProjMenu();
  }
}
function closeProjMenu(){
  projMenuOpen = false;
  if(typeof currentView !== 'undefined' && currentView === 'home'){
    const vh0 = document.getElementById('vtab-home');
    if(vh0) vh0.classList.add('active');
  }
  const pn = document.getElementById('projMenuPanel');
  if(pn) pn.style.pointerEvents = 'none';
  /* 「项目」按钮：当前就在项目页时保持高亮，否则取消 */
  const vp = document.getElementById('vtab-projects');
  if(vp) vp.classList.toggle('active', currentView === 'projects');
  const panel = document.getElementById('projMenuPanel');
  if(panel) panel.classList.remove('show');
}
function pickProjMenu(tab){
  /* 记住这个模块属于哪个分组，下次打开菜单仍然展开着 */
  PROJ_MENU_GROUPS.forEach(function(g){
    if(g.items.some(function(it){ return it.tab === tab; })) projMenuGroup = g.key;
  });
  closeProjMenu();
  setView('projects');
  const btn = document.querySelector('.tab-btn[data-tab="' + tab + '"]');
  if(btn) btn.click();
  paintProjMenu();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
/* 窗口尺寸变化时，打开的菜单重新定位 */
window.addEventListener('resize', function(){ if(projMenuOpen) placeProjMenu(); });
/* 页面滚动时也跟着按钮走 */
window.addEventListener('scroll', function(){ if(projMenuOpen) placeProjMenu(); }, true);

/* 点空白处 / 按 Esc 关闭 —— 注意要放过「项目」按钮和面板本身，
   否则点「项目」打开后会被这次冒泡立刻关掉（看起来就是“点了没反应”） */
document.addEventListener('click', function(e){
  if(!projMenuOpen || !e || !e.target) return;
  const t = e.target;
  const panel = document.getElementById('projMenuPanel');
  const trigger = document.getElementById('vtab-projects');
  if(panel && panel.contains(t)) return;        /* 点在菜单里 */
  if(trigger && trigger.contains(t)) return;    /* 点在「项目」按钮上 */
  closeProjMenu();
});
document.addEventListener('keydown', function(e){
  if(e && e.key === 'Escape' && projMenuOpen){
    if(e.preventDefault) e.preventDefault();
    closeProjMenu();
  }
});

/* ================= 首页日历：24 节气 / 农历节日 / 今日高亮 ================= */
const CAL_TERMS = ['小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至',
  '小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];
const CAL_TERM_LON = CAL_TERMS.map((_, i) => (285 + i * 15) % 360);   /* 对应太阳黄经 */
const CAL_RAD = Math.PI / 180;

/* 太阳视黄经（度）——精确推算节气，无需逐年校正表 */
function calSunLon(jd){
  const T = (jd - 2451545) / 36525;
  const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  const M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
  const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M * CAL_RAD)
          + (0.019993 - 0.000101 * T) * Math.sin(2 * M * CAL_RAD)
          + 0.000289 * Math.sin(3 * M * CAL_RAD);
  const omega = 125.04 - 1934.136 * T;
  return ((L0 + C - 0.00569 - 0.00478 * Math.sin(omega * CAL_RAD)) % 360 + 360) % 360;
}

/* 某年第 i 个节气落在当月几号（北京时间 UTC+8） */
function calTermDay(y, i){
  const target = CAL_TERM_LON[i];
  const month = Math.floor(i / 2) + 1;
  let jd = Date.UTC(y, month - 1, 1) / 86400000 + 2440587.5 - 8 / 24;
  for (let k = 0; k < 10; k++){                       /* 牛顿迭代逼近 */
    const diff = ((target - calSunLon(jd) + 540) % 360) - 180;
    if (Math.abs(diff) < 1e-7) break;
    jd += diff * 1.0146;                              /* 黄经 1° ≈ 1.0146 天 */
  }
  return new Date((jd + 8 / 24 - 2440587.5) * 86400000).getUTCDate();
}

/* 农历数据 1900-2100：bit16 闰月大小 · bit15-4 十二月大小 · bit3-0 闰月月份 */

  0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
  0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
  0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
  0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
  0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,
  0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
  0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
  0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
  0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
  0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
  0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,
  0x0a2e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
  0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
  0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,
  0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,
  0x0d520
];
const CAL_LUNAR_DAYS = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
  '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
  '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
const CAL_LUNAR_MON = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];

function calLeapMonth(info){ return info & 0xf; }
function calLeapDays(info){ return (info & 0xf) ? (((info >> 16) & 1) ? 30 : 29) : 0; }
function calMonthDays(info, i){ return (info & (0x10000 >> i)) ? 30 : 29; }
function calYearDays(info){
  let sum = 348;
  for (let k = 0x8000; k > 8; k >>= 1) sum += (info & k) ? 1 : 0;
  return sum + calLeapDays(info);
}

/* 公历 → 农历；超出 1900-2100 返回 null */
function calLunar(y, m, d){
  const idx = y - 1900;
  if (idx < 0 || idx >= CAL_LUNAR.length) return null;
  let offset = Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(1900, 0, 31)) / 86400000);
  if (offset < 0) return null;
  let ly = 1900, info = 0;
  for (; ly <= 2100; ly++){
    info = CAL_LUNAR[ly - 1900];
    const yd = calYearDays(info);
    if (offset < yd) break;
    offset -= yd;
  }
  if (ly > 2100) return null;
  const leap = calLeapMonth(info);
  for (let mm = 1; mm <= 12; mm++){
    const dm = calMonthDays(info, mm);
    if (offset < dm) return { m: mm, d: offset + 1, leap: false };
    offset -= dm;
    if (leap === mm){                                  /* 闰月紧跟同号普通月 */
      const dl = calLeapDays(info);
      if (offset < dl) return { m: mm, d: offset + 1, leap: true };
      offset -= dl;
    }
  }
  return null;
}

/* 节日：农历（月-日）与公历（月-日） */
const CAL_LUNAR_FEST = {'1-1':'春节','1-15':'元宵','5-5':'端午','7-7':'七夕','8-15':'中秋','9-9':'重阳','12-8':'腊八'};
const CAL_SOLAR_FEST = {'1-1':'元旦','2-14':'情人节','3-8':'妇女节','3-12':'植树节','5-1':'劳动节',
  '5-4':'青年节','6-1':'儿童节','7-1':'建党节','8-1':'建军节','9-10':'教师节','10-1':'国庆节','12-25':'圣诞节'};

let calCursor = null;                                  /* {y, m} 当前显示的年月 */

/* 汇总一个月的节气 / 节日 / 农历 */
function calMonthInfo(y, m){
  const terms = {}, fests = {}, lunar = {}, dim = new Date(y, m, 0).getDate();
  for (let i = 0; i < 24; i++){
    if (Math.floor(i / 2) + 1 !== m) continue;
    const day = calTermDay(y, i);
    if (day >= 1 && day <= dim) terms[day] = CAL_TERMS[i];
  }
  for (let d = 1; d <= dim; d++){
    const lu = calLunar(y, m, d);
    lunar[d] = lu;
    const list = [terms[d], CAL_SOLAR_FEST[m + '-' + d], (lu && !lu.leap) ? CAL_LUNAR_FEST[lu.m + '-' + lu.d] : null].filter(Boolean);
    if (list.length) fests[d] = list;
  }
  return { terms, fests, lunar, dim };
}

function calMove(step){
  if (!calCursor) return;
  if (step === 0){
    const n = new Date();
    calCursor = { y: n.getFullYear(), m: n.getMonth() + 1 };
  } else {
    let m = calCursor.m + step, y = calCursor.y;
    if (m < 1){ m = 12; y--; } else if (m > 12){ m = 1; y++; }
    calCursor = { y, m };
  }
  calRender();
}

function calRender(){
  const grid = document.getElementById('calGrid');
  if (!grid || !calCursor) return;
  const { y, m } = calCursor;
  const now = new Date();
  const info = calMonthInfo(y, m);
  const title = document.getElementById('calTitle');
  if (title) title.textContent = y + ' 年 ' + m + ' 月';

  const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7;   /* 周一为首列 */
  const prevDim = new Date(y, m - 1, 0).getDate();
  const cells = [];
  for (let i = lead - 1; i >= 0; i--) cells.push({ d: prevDim - i, pad: true });
  for (let d = 1; d <= info.dim; d++) cells.push({ d, pad: false });
  while (cells.length % 7) cells.push({ d: cells.length - lead - info.dim + 1, pad: true });

  grid.innerHTML = cells.map(c => {
    if (c.pad) return '<div class="cal-day pad">' + c.d + '</div>';
    const isToday = (y === now.getFullYear() && m === now.getMonth() + 1 && c.d === now.getDate());
    const fest = (info.fests[c.d] || [])[0];
    const lu = info.lunar[c.d];
    const note = fest || (lu ? (lu.d === 1 ? CAL_LUNAR_MON[lu.m - 1] + '月' : CAL_LUNAR_DAYS[lu.d - 1]) : '');
    const cls = 'cal-day' + (isToday ? ' today' : (fest ? ' rest' : (info.terms[c.d] ? ' term' : '')));
    const tip = [y + '年' + m + '月' + c.d + '日',
      lu ? ('农历' + (lu.leap ? '闰' : '') + CAL_LUNAR_MON[lu.m - 1] + '月' + CAL_LUNAR_DAYS[lu.d - 1]) : '',
      info.terms[c.d] || '', (info.fests[c.d] || []).join(' / ')].filter(Boolean).join('  ·  ');
    return '<div class="' + cls + '" title="' + tip + '">' + c.d +
      (note ? '<span class="notes">' + note + '</span>' : '') + '</div>';
  }).join('');

}

function calBuild(){
  if (calCursor || !document.getElementById('calCard')) return;
  const n = new Date();
  calCursor = { y: n.getFullYear(), m: n.getMonth() + 1 };
  calRender();
}

(function initViews(){
  buildProjMenu();
  bindProjMenuGuards();
  buildGallery();
  calBuild();
  let saved = 'home';
  try{ saved = localStorage.getItem('_view') || 'home'; }catch(e){}
  setView(saved);
  /* 切换标签时同步下拉高亮 */
  document.querySelectorAll('.tab-btn[data-tab]').forEach(function(b){
    b.addEventListener('click', function(){ setTimeout(paintProjMenu, 0); });
  });
})();
</script>

<script>
/* ========== 页脚世界时间 ==========
   放在页面末尾，元素一定已存在，不会再卡在 --:--:--。
   只保留三个国家的时间 + 本地时间：
     中国（Asia/Shanghai, UTC+8）
     日本（Asia/Tokyo,    UTC+9）
     美国（America/New_York, 东部时间，会随夏令时变化）
   时间是浏览器按 UTC 基准换算的（本地运行、不联网）；
   浏览器不认识时区名时会退回「UTC+固定偏移」算法，不会显示空白。 */
const TZ_LIST = [
  { id:'local',               label:'本地时间' },
  { id:'Asia/Shanghai',      label:'中国 UTC+8' },
  { id:'Asia/Tokyo',         label:'日本 UTC+9' },
  { id:'America/New_York',  label:'美国 UTC-5' }
];
/* 离线兜底：时区名不可用时，用「UTC + 固定偏移(分钟)」自己算 */
const TZ_OFFSET_FALLBACK = {
  'Asia/Shanghai':480, 'Asia/Tokyo':540, 'America/New_York':-300
};

let worldTz = 'local';
try{ worldTz = localStorage.getItem('_worldTz') || 'local'; }catch(e){}

function tzText(id){
  if(id === 'local'){
    const d = new Date();
    const p = n => (n < 10 ? '0' : '') + n;
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  /* 1) 优先用浏览器的时区换算（会自动处理夏令时） */
  try{
    const s = new Intl.DateTimeFormat('en-GB', {
      timeZone:id, hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
    }).format(new Date());
    if(s && s.indexOf(':') > 0) return s.replace(/^24:/, '00:');
  }catch(e){ /* 时区名不认识 → 走下面的兜底 */ }
  /* 2) 兜底：UTC + 固定偏移 */
  const off = TZ_OFFSET_FALLBACK[id];
  if(typeof off === 'number'){
    const d = new Date(Date.now() + off * 60000);
    const p = n => (n < 10 ? '0' : '') + n;
    return p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds());
  }
  const d = new Date();
  const p = n => (n < 10 ? '0' : '') + n;
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function paintWorldClock(){
  const el = document.getElementById('footClock');
  if(el) el.textContent = tzText(worldTz);
}
function setWorldTimeZone(id){
  worldTz = id || 'local';
  const item = TZ_LIST.find(function(t){ return t.id === worldTz; });
  const lb = document.getElementById('footTzLabel');
  if(lb) lb.textContent = (worldTz === 'local') ? '本地时间' : (item ? item.label : worldTz);
  try{ localStorage.setItem('_worldTz', worldTz); }catch(e){}
  paintWorldClock();
}

/* 取访客位置：依次尝试多个免费源，任一成功即可 */
async function wxLocate(){
  /* 定位源按准确度排序（已实测：ipinfo.io 会把中国移动 IP 误判到上海，不用它；
     ipwho.is 会把同一个 IPv6 出口判到嘉兴，所以中文源放在第二位兜底）
     地名一律由下面的 EN_CN_* 词典翻成中文，中文源 ipwho.is?lang=zh-CN 命中时本身就是中文。 */
  const srcs = [
    { url:'https://api.ip.sb/geoip', pick:function(d){
        return { lat:d.latitude, lon:d.longitude, city:d.city, region:d.region, country:d.country };
    }},
    { url:'https://ipwho.is/?lang=zh-CN', pick:function(d){
        return { lat:d.latitude, lon:d.longitude, city:d.city, region:d.region, country:d.country };
    }},
    { url:'https://api.ipapi.is/', pick:function(d){
        return { lat:d.lat, lon:d.lon, city:d.city, region:d.region, country:d.country };
    }}
  ];
  for(let i = 0; i < srcs.length; i++){
    let timer = null;
    try{
      /* 单个源最多等 7 秒，避免某个接口卡住时页脚一直停在「--°」 */
      const ctl = (typeof AbortController === 'function') ? new AbortController() : null;
      if(ctl) timer = setTimeout(function(){ ctl.abort(); }, 7000);
      const r = await fetch(srcs[i].url, { cache:'no-store', signal: ctl ? ctl.signal : undefined });
      if(timer){ clearTimeout(timer); timer = null; }
      if(!r.ok) continue;
      const d = await r.json();
      const p = srcs[i].pick(d);
      if(p && isFinite(parseFloat(p.lat)) && isFinite(parseFloat(p.lon))) return p;
    }catch(e){ /* 换下一个源 */ }
    finally{ if(timer) clearTimeout(timer); }
  }
  return null;
}
